[project]
name = "i-itsm"
version = "0.1.0"
description = "Intelligent IT Service Management & Incident Resolution System (CS F213)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "apscheduler>=3.10,<4",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "joblib>=1.4",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
]

[project.optional-dependencies]
# Separate so CI/unit tests can skip the ~200 MB torch install. Docker installs it.
ml = ["sentence-transformers>=3.0"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "time-machine>=2.14",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
include = ["app*", "domain*", "notifications*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not model and not integration'"
markers = [
    "integration: needs Postgres (run with -m integration)",
    "model: needs the real MiniLM model (run with -m model)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# PENDING_P1: P1's files aren't ruff-clean yet (14 findings, 12 auto-fixable with
# `ruff check --fix`). Remove this once P1 has run it on their own branch.
extend-exclude = ["domain", "play.py", "tests/test_*.py", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["app/jobs", "app/intelligence", "app/p4_contracts.py", "app/p4_wiring.py"]

# P1's domain/ is untyped; treat it as Any from P4's strictly-typed code.
[[tool.mypy.overrides]]
module = ["domain", "domain.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "sklearn.*", "joblib.*", "apscheduler.*"]
ignore_missing_imports = true
